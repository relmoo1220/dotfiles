# Single-line prompt: no blank line above, everything on one row
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character"""

[directory]
truncate_to_repo = false
truncation_length = 0

[git_branch]
format = "([$symbol$branch]($style)) "

[git_status]
format = "([$all_status$ahead_behind]($style)) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
